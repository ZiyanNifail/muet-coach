services:
  - type: web
    name: muet-coach-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
