<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="fluency.my logo">
  <!--
    fluency.my logo — transparent background, ready for Canva
    Icon: 5 waveform bars (teal #3A7D6A)
    Wordmark: "fluency" bold serif teal + ".my" normal weight dark
  -->

  <!-- Waveform icon (original viewBox 0 0 48 40, scaled 1.5x → 72x60, centred in 72px height) -->
  <g transform="translate(6, 6) scale(1.5)">
    <!-- bar 1  shortest -->
    <line x1="5"  y1="17" x2="5"  y2="23" stroke="#3A7D6A" stroke-width="6" stroke-linecap="round"/>
    <!-- bar 2  medium -->
    <line x1="14" y1="11" x2="14" y2="29" stroke="#3A7D6A" stroke-width="6" stroke-linecap="round"/>
    <!-- bar 3  tallest -->
    <line x1="23" y1="5"  x2="23" y2="35" stroke="#3A7D6A" stroke-width="6" stroke-linecap="round"/>
    <!-- bar 4  medium -->
    <line x1="32" y1="11" x2="32" y2="29" stroke="#3A7D6A" stroke-width="6" stroke-linecap="round"/>
    <!-- bar 5  shortest -->
    <line x1="41" y1="17" x2="41" y2="23" stroke="#3A7D6A" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark — x=90 puts it right after icon (6 + 72 + 12 gap) -->
  <text y="47" font-family="'Libre Baskerville', Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="-0.5">
    <tspan x="90" font-weight="700" fill="#3A7D6A">fluency</tspan><tspan font-weight="400" fill="#1C1A17">.my</tspan>
  </text>
</svg>
